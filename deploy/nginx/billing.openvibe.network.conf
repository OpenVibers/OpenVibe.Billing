## ═══════════════════════════════════════════════════════════════
## billing.openvibe.network — Nginx Configuration (EXAMPLE)
##
## Deploy to /etc/nginx/sites-available/billing.openvibe.network.conf and reload nginx.
##
## The Node app (port 4600, systemd unit openvibe-billing). Other OpenVibe services call the
## service API on http://127.0.0.1:4600/api/v1 directly; the public host exposes:
##   /webhooks/<provider>   payment provider deliveries (PowerChat today)
##   /api/health            liveness for uptime checks
##   /, /auth/*, …          the staff console (Network SSO, staff only; server-rendered, noindex)
## /api/v1 is DENIED here: it stays reachable only from loopback (service tokens protect it anyway;
## keeping it off the public edge removes the attack surface). Every other /api/* path is 404.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovbilling_hooks:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ovbilling_console:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name billing.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://billing.openvibe.network$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name billing.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/billing.openvibe.network.access.log;
    error_log  /var/log/nginx/billing.openvibe.network.error.log;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Provider webhooks: the raw body must reach Node untouched (signatures cover it).
    location /webhooks/ {
        limit_req zone=ovbilling_hooks burst=40 nodelay;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:4600;
    }

    location = /api/health { proxy_pass http://127.0.0.1:4600; }

    # The service API: loopback only. Never proxied from the public host.
    location ^~ /api/v1 { deny all; }
    location ^~ /api/ { return 404; }

    # Staff console (the app sets CSP, X-Frame-Options, no-store and noindex on every page).
    location / {
        limit_req zone=ovbilling_console burst=30 nodelay;
        proxy_pass http://127.0.0.1:4600;
    }
}
