name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check, npm test and openvibe-contracts-check: the shared test job (Track Q).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@f5e7e73b82b5f62360e2a16693ff638cae49082f
    with:
      contracts-service: billing
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@83c998b65424fb97e6f6de55ad9cc5981767e89c
